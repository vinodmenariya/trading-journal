name: Auto Save Predictions

on:
  schedule:
    - cron: "30 2 * * 1-5"      # 02:30 UTC = 08:00 IST, Somvar-Shukravar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run auto save
        run: python auto_save.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions_log.csv || true
          git add auto_save_log.txt || true
          git diff --cached --quiet || git commit -m "Auto-save predictions $(date -u +%F)"
          git push
